<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunday</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="container">
    <header>
      <h1>Sunday</h1>
      <div class="subtitle">When does every day feel like this?</div>
    </header>

    <div class="calculator-card">
      
      <!-- 1. THE GOAL -->
      <div class="section goal-section">
        <label class="label-muted">I need a monthly income of</label>
        <div class="input-wrapper huge-input">
          <span class="currency">$</span>
          <input type="number" id="targetIncome" value="5000" step="100">
        </div>
        <div class="goal-display">
          <span class="goal-label">YOUR FREEDOM NUMBER</span>
          <span class="goal-value" id="freedomNumber">$1.5M</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 2. THE REALITY -->
      <div class="section reality-section">
        <div class="input-row">
          <div class="field">
            <label>Current Age</label>
            <input type="number" id="currentAge" value="30">
          </div>
          <div class="field">
            <label>Current Savings</label>
            <div class="input-wrapper">
              <span class="currency">$</span>
              <input type="number" id="currentSavings" value="50000" step="1000">
            </div>
          </div>
          <div class="field">
            <label>Annual Return</label>
            <div class="input-wrapper">
              <input type="number" id="interestRate" value="7" step="0.1">
              <span class="suffix">%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. THE LEVER (Hero Slider) -->
      <div class="section lever-section">
        <label class="label-accent">I will invest monthly</label>
        <div class="hero-slider-value" id="disp-monthlySavings">$2,000</div>
        <input type="range" id="monthlySavings" min="0" max="20000" step="100" value="2000" class="hero-slider">
      </div>

      <!-- 4. THE RESULT -->
      <div class="result-bar">
        <div class="result-text">
          You will be free in <span class="highlight-year" id="freedomYears">12 Years</span>
        </div>
        <div class="result-sub">
          Reaching financial independence by <span class="highlight-date" id="freedomDate">2038</span> (Age <span id="freedomAge">42</span>)
        </div>
      </div>

    </div>
  </div>

  <footer>
    Built with the Lumina Design System.
  </footer>

  <script src="app.js"></script>
</body>
</html>
